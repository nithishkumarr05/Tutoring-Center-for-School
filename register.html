<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">

<head>

    <!-- Favicon -->
  <link rel="icon" href="assets/fav.jpeg" type="image/jpeg">    <meta name="description" content="Join StudyPoint — create an account, track your progress, manage tutoring sessions, and unlock your learning potential.">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {

                            secondary: '#1E293B',

    <style>
        body {
            transition: background-color 0.3s, color 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .hide-scrollbar::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .hide-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar-thumb {
            background: #059669;
            border-radius: 10px;
        }
        .hide-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #059669 transparent;
        }

        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }
        .slow-zoom {
            animation: slowZoom 28s ease-in-out infinite alternate;
        }

        @keyframes floatPop {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }
        .float-pop {
            animation: floatPop 6s ease-in-out infinite;
        }

        .btn-shine {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .btn-shine::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }
        .btn-shine:hover::after {
            left: 100%;
        }

        @keyframes toastFade {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }
        .toast-animation {
            animation: toastFade 2.5s ease forwards;
        }

        [dir="rtl"] .rtl\:right-auto {
            right: auto;
        }
        [dir="rtl"] .rtl\:left-0 {
            left: 0;
        }
        [dir="rtl"] .rtl\:rotate-180 {
            transform: rotate(180deg);
        }
        [dir="rtl"] .me-2 {
            margin-left: 0.5rem;
            margin-right: 0;
        }
        [dir="rtl"] .ms-2 {
            margin-right: 0.5rem;
            margin-left: 0;
        }

        input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px #f9f9f9 inset !important;
        }
        .dark input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px #0a0a0a inset !important;
            -webkit-text-fill-color: #e5e5e5 !important;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(2px);
            transition: all 0.2s ease;
        }
        .dark .glass-card {
            background: rgba(10, 10, 10, 0.98);
            backdrop-filter: blur(2px);
        }

        .animated-border {
            position: relative;
            background: linear-gradient(60deg, #059669, #10B981, #059669);
            background-size: 200% 200%;
            animation: gradientShift 3s ease infinite;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @media (max-width: 400px) {
            .glass-card .p-6, .glass-card .p-8, .glass-card>div:last-child {
                padding-left: 1rem !important;
                padding-right: 1rem !important;
            }
            .glass-card {
                border-radius: 1.5rem !important;
            }
            .glass-card .text-center.mb-6 {
                margin-bottom: 0.5rem !important;
            }
            .glass-card .flex.justify-center.gap-3 {

                gap: 0.75rem !important;
            }

                margin-top: 0.5rem !important;

        @media (max-height: 850px) and (max-width: 400px) {

                padding-bottom: 0.4rem !important;
            }

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none w-auto max-w-[90vw]"></div>

    <script>
        (function() {
            // Toast helper
            function showToast(message, type = 'success') {
                const container = document.getElementById('toastContainer');
                if (!container) return;
                const toast = document.createElement('div');
                let bgColor = 'bg-emerald-600';
                let icon = '<i class="fas fa-check-circle text-white text-sm"></i>';
                if (type === 'error') { bgColor = 'bg-red-500'; icon = '<i class="fas fa-times-circle text-white text-sm"></i>'; }
                else if (type === 'warning') { bgColor = 'bg-amber-500'; icon = '<i class="fas fa-exclamation-triangle text-white text-sm"></i>'; }
                else if (type === 'info') { bgColor = '#059669'; icon = '<i class="fas fa-info-circle text-white text-sm"></i>'; }
                toast.className = `toast-animation mb-2 px-5 py-3 rounded-xl shadow-lg text-xs sm:text-sm font-medium flex items-center gap-2 pointer-events-auto text-white max-w-full`;
                toast.style.backgroundColor = bgColor;
                toast.innerHTML = `${icon} <span class="break-words">${message}</span>`;
                container.appendChild(toast);
                setTimeout(() => { if (toast && toast.remove) toast.remove(); }, 2600);
            }

            // Password visibility toggles
            function initPasswordToggles() {
                document.querySelectorAll('.toggle-password').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        const wrapper = btn.closest('.relative');
                        if (!wrapper) return;
                        const input = wrapper.querySelector('input');
                        const icon = btn.querySelector('i');
                        if (input.type === 'password') {
                            input.type = 'text';
                            if (icon) { icon.className = 'fas fa-eye'; }
                        } else {
                            input.type = 'password';
                            if (icon) { icon.className = 'fas fa-eye-slash'; }
                        }
                    });
                });
            }

            // Theme toggle
            const themeToggle = document.getElementById('theme-toggle-signup');
            const htmlTag = document.documentElement;

            function updateThemeIcons() {
                const isDark = htmlTag.classList.contains('dark');
                const sunIcon = document.querySelector('#theme-toggle-signup .fa-sun');
                const moonIcon = document.querySelector('#theme-toggle-signup .fa-moon');
                if (sunIcon && moonIcon) {
                    if (isDark) {
                        sunIcon.classList.add('hidden');
                        moonIcon.classList.remove('hidden');
                    } else {
                        sunIcon.classList.remove('hidden');
                        moonIcon.classList.add('hidden');
                    }
                }
            }

            function toggleTheme() {
                if (htmlTag.classList.contains('dark')) {
                    htmlTag.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                } else {
                    htmlTag.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                }
                updateThemeIcons();
            }
            if (themeToggle) themeToggle.addEventListener('click', toggleTheme);

            // Initialize theme
            if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('prefers-color-scheme: dark').matches)) {
                htmlTag.classList.add('dark');
            } else {
                htmlTag.classList.remove('dark');
            }
            updateThemeIcons();

            // RTL Toggle
            const rtlToggle = document.getElementById('rtl-toggle-signup');

            function applyRTLStyles(isRtl) {
                if (isRtl) {
                    htmlTag.setAttribute('dir', 'rtl');
                    localStorage.setItem('direction', 'rtl');
                } else {
                    htmlTag.removeAttribute('dir');
                    localStorage.setItem('direction', 'ltr');
                }
            }

            function toggleRTL() {
                const currentDir = htmlTag.getAttribute('dir');
                if (currentDir === 'rtl') {
                    applyRTLStyles(false);
                    showToast('LTR layout activated', 'info');
                } else {
                    applyRTLStyles(true);
                    showToast('RTL layout activated', 'info');
                }
            }
            if (rtlToggle) rtlToggle.addEventListener('click', toggleRTL);
            if (localStorage.getItem('direction') === 'rtl') {
                htmlTag.setAttribute('dir', 'rtl');
            } else if (localStorage.getItem('direction') === 'ltr') {
                htmlTag.removeAttribute('dir');
            }

            // Social sign-up demo handlers
            const socialHandlers = { google: 'Google', facebook: 'Facebook', apple: 'Apple' };
            Object.keys(socialHandlers).forEach(provider => {
                const btn = document.getElementById(`${provider}Signup`);
                if (btn) {
                    btn.addEventListener('click', () => {
                        showToast(`${socialHandlers[provider]} sign-up coming soon! Use email to get started.`, 'info');
                    });
                }
            });

            // Form validation and account creation
            const signupForm = document.getElementById('signupForm');
            if (signupForm) {
                signupForm.addEventListener('submit', (e) => {
                    e.preventDefault();

                    const fullname = document.getElementById('fullname').value.trim();
                    const email = document.getElementById('email').value.trim();
                    const password = document.getElementById('password').value;
                    const confirm = document.getElementById('confirmPassword').value;
                    const termsChecked = document.getElementById('termsCheckbox').checked;

                    if (!fullname || fullname.length < 2) {
                        return showToast('Please enter your full name', 'warning');
                    }
                    const emailPattern = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
                    if (!emailPattern.test(email)) {
                        return showToast('Please enter a valid email address', 'error');
                    }
                    if (!password || password.length < 6) {
                        return showToast('Password must be at least 6 characters', 'warning');
                    }
                    if (password !== confirm) {
                        return showToast('Passwords do not match', 'error');
                    }
                    if (!termsChecked) {
                        return showToast('Please agree to the Terms of Service', 'warning');
                    }

                    const firstName = fullname.split(' ')[0] || "Learner";
                    showToast(`🎓 Welcome ${firstName}! Your learning journey with StudyPoint has begun.`, 'success');
                    // Uncomment to redirect: setTimeout(() => { window.location.href = "dashboard.html"; }, 1500);
                });
            }

            // Fix for keyboard open on mobile
            const mainCard = document.querySelector('main');
            if (mainCard) {
                const inputs = mainCard.querySelectorAll('input');
                inputs.forEach(inp => {
                    inp.addEventListener('focus', () => {
                        setTimeout(() => {
                            if (mainCard) {
                                mainCard.scrollTo({ top: mainCard.scrollHeight, behavior: 'smooth' });
                            }
                        }, 200);
                    });
                });
            }

            initPasswordToggles();
        })();
    </script>
</body>
</html>
