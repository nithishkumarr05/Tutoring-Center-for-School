<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <g filter="url(#drop-shadow)" transform="translate(10, 10)">
    <!-- Paper 1 (Back, tilted left) -->
    <g transform="translate(100, 100) rotate(-10) translate(-100, -100)">
      <path d="M40 30 L140 30 L140 170 L40 170 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <rect x="55" y="50" width="70" height="4" fill="#cbd5e1" rx="2"/>
      <rect x="55" y="65" width="50" height="4" fill="#cbd5e1" rx="2"/>
      <rect x="55" y="90" width="70" height="4" fill="#cbd5e1" rx="2"/>
      <rect x="55" y="105" width="60" height="4" fill="#cbd5e1" rx="2"/>
      <rect x="55" y="120" width="65" height="4" fill="#cbd5e1" rx="2"/>
      <circle cx="120" cy="60" r="15" fill="#f87171" opacity="0.8"/>
    </g>

    <!-- Paper 2 (Front, slightly tilted right) -->
    <g transform="translate(110, 110) rotate(5) translate(-110, -110)">
      <path d="M60 40 L160 40 L160 180 L60 180 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <text x="80" y="70" font-family="sans-serif" font-weight="bold" font-size="12" fill="#334155">TEST PAPER</text>
      <rect x="75" y="85" width="70" height="4" fill="#94a3b8" rx="2"/>
      <rect x="75" y="100" width="50" height="4" fill="#94a3b8" rx="2"/>
      <rect x="75" y="125" width="70" height="4" fill="#94a3b8" rx="2"/>
      <rect x="75" y="140" width="60" height="4" fill="#94a3b8" rx="2"/>
      <!-- A+ Mark -->
      <text x="120" y="160" font-family="sans-serif" font-weight="bold" font-size="24" fill="#ef4444" transform="rotate(-15 120 160)">A+</text>
    </g>
  </g>
</svg>
