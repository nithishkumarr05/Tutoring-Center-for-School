<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="4" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <g filter="url(#drop-shadow)" transform="translate(10, 10)">
    <!-- Book 1 (Bottom, tilted right) -->
    <g transform="translate(80, 100) rotate(15) translate(-80, -100)">
      <!-- Pages -->
      <path d="M40 70 L140 70 L145 150 L45 150 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <!-- Cover -->
      <path d="M30 65 L135 65 L140 155 L35 155 Z" fill="#2563eb" rx="2"/>
      <!-- Spine -->
      <path d="M30 65 L35 155 L25 150 L20 60 Z" fill="#1d4ed8"/>
      <!-- Text/Decor -->
      <rect x="50" y="80" width="60" height="8" fill="#60a5fa" rx="4"/>
      <rect x="50" y="95" width="40" height="4" fill="#93c5fd" rx="2"/>
      <text x="50" y="125" font-family="sans-serif" font-weight="bold" font-size="14" fill="white">SCIENCE</text>
    </g>

    <!-- Book 2 (Top, slightly tilted left) -->
    <g transform="translate(100, 90) rotate(-5) translate(-100, -90)">
      <!-- Pages -->
      <path d="M60 50 L160 50 L165 130 L65 130 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <!-- Cover -->
      <path d="M50 45 L155 45 L160 135 L55 135 Z" fill="#16a34a" rx="2"/>
      <!-- Spine -->
      <path d="M50 45 L55 135 L45 130 L40 40 Z" fill="#15803d"/>
      <!-- Text/Decor -->
      <rect x="70" y="60" width="60" height="8" fill="#4ade80" rx="4"/>
      <rect x="70" y="75" width="40" height="4" fill="#86efac" rx="2"/>
      <text x="70" y="105" font-family="sans-serif" font-weight="bold" font-size="14" fill="white">NCERT</text>
    </g>
  </g>
</svg>
