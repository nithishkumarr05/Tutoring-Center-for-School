<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <g filter="url(#drop-shadow)" transform="translate(10, 10)">
    <!-- Clipboard Board -->
    <path d="M40 30 L140 30 L140 180 L40 180 Z" fill="#92400e" rx="4"/>
    
    <!-- Paper -->
    <path d="M50 40 L130 40 L130 170 L50 170 Z" fill="#ffffff" rx="2"/>
    
    <!-- Clipboard Clip -->
    <rect x="75" y="15" width="30" height="20" fill="#cbd5e1" rx="2"/>
    <circle cx="90" cy="25" r="4" fill="#475569"/>
    
    <!-- Content on Paper -->
    <rect x="60" y="60" width="60" height="4" fill="#94a3b8" rx="2"/>
    <rect x="60" y="75" width="40" height="4" fill="#94a3b8" rx="2"/>
    
    <!-- Important Star -->
    <g transform="translate(90, 120)">
      <circle cx="0" cy="0" r="25" fill="#fef08a"/>
      <path d="M0 -15 L4 -5 L15 -5 L6 2 L9 12 L0 6 L-9 12 L-6 2 L-15 -5 L-4 -5 Z" fill="#eab308"/>
    </g>
  </g>
</svg>
