<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="4" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <g filter="url(#drop-shadow)" transform="translate(10, 20)">
    <!-- Open Book -->
    <!-- Back Cover -->
    <path d="M20 70 C 50 60, 90 70, 90 70 L 90 140 C 90 140, 50 130, 20 140 Z" fill="#d97706"/>
    <path d="M160 70 C 130 60, 90 70, 90 70 L 90 140 C 90 140, 130 130, 160 140 Z" fill="#d97706"/>
    
    <!-- Pages Left -->
    <path d="M30 65 C 55 55, 90 65, 90 65 L 90 130 C 90 130, 55 120, 30 130 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Pages Right -->
    <path d="M150 65 C 125 55, 90 65, 90 65 L 90 130 C 90 130, 125 120, 150 130 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Spine Line -->
    <line x1="90" y1="65" x2="90" y2="135" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Text Lines Left -->
    <path d="M40 85 C 60 78, 80 82, 80 82" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M40 100 C 60 93, 80 97, 80 97" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M40 115 C 60 108, 70 112, 70 112" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Text Lines Right -->
    <path d="M140 85 C 120 78, 100 82, 100 82" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M140 100 C 120 93, 100 97, 100 97" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Floating Leaf/Decor -->
    <path d="M130 90 C 140 70, 160 90, 140 110 C 120 90, 140 70, 130 90 Z" fill="#4ade80" opacity="0.8"/>
  </g>
</svg>
