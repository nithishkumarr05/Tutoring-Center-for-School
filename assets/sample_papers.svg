<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <g filter="url(#drop-shadow)" transform="translate(10, 10)">
    <!-- Document Stack Base -->
    <g transform="translate(90, 110) rotate(-15) translate(-90, -110)">
      <path d="M40 30 L140 30 L140 170 L40 170 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    </g>
    <!-- Document Stack Middle -->
    <g transform="translate(100, 105) rotate(0) translate(-100, -105)">
      <path d="M50 20 L150 20 L150 160 L50 160 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    </g>
    <!-- Main Document -->
    <g transform="translate(110, 100) rotate(15) translate(-110, -100)">
      <path d="M60 10 L160 10 L160 150 L60 150 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
      <rect x="75" y="30" width="70" height="6" fill="#3b82f6" rx="3"/>
      <rect x="75" y="50" width="50" height="4" fill="#94a3b8" rx="2"/>
      <rect x="75" y="65" width="60" height="4" fill="#94a3b8" rx="2"/>
      <!-- Sample stamp -->
      <g transform="translate(110, 100) rotate(-20) translate(-110, -100)">
        <rect x="75" y="80" width="70" height="24" fill="none" stroke="#ef4444" stroke-width="2" rx="4"/>
        <text x="83" y="97" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ef4444">SAMPLE</text>
      </g>
    </g>
  </g>
</svg>
